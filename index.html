<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alesia Experience - Puglia Nel Cuore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-white: #fdfbf7;
      --gold-accent: #e0a96d;
      --terracotta: #c85a32;
      --olive-green: #2d5a27;
      --sea-blue: #0077b6;
      /* Sfondo ultrasottile quasi trasparente per far vedere bene il video */
      --glass-bg: rgba(0, 0, 0, 0.25);
      --glass-border: rgba(255, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Video di sfondo con fallback immagine */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      filter: brightness(1) saturate(1.1);
      background: #000;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, rgba(17, 13, 10, 0.12), rgba(17, 13, 10, 0.3)),
        url('178180.webp') no-repeat center center / cover;
      z-index: -2;
      display: none;
    }

    /* Overlay minimalista per massima visibilità del video */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.15);
      z-index: -1;
    }

    /* Layout Principale */
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .location-tag {
      position: fixed;
      top: 1.1rem;
      left: 1.2rem;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f7f1e6;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .location-tag i {
      color: var(--gold-accent);
      font-size: 0.8rem;
    }

    .language-switcher {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 5;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: #fff;
      font: 500 0.8rem 'Montserrat', sans-serif;
      cursor: pointer;
      outline: none;
    }

    .language-switcher select {
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .language-switcher option {
      color: #222;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Card Glassmorphism Leggera e Trasparente */
    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 2rem 1.6rem 1.8rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1s ease-in-out;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0.7rem;
      transform: translateX(-50%);
      width: 140px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    }

    /* Logo Alesia */
    .brand-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 0 auto 1rem;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)) saturate(1.25);
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.45rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 4.2vw, 4.2rem);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    .subtitle {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.32em;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    /* Pulsanti */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 1rem 1.5rem;
      border-radius: 50px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    .btn i {
      font-size: 1.3rem;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    }

    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .btn-web {
      background: linear-gradient(135deg, var(--sea-blue), #00b4d8);
    }

    .btn-review {
      background: linear-gradient(135deg, var(--gold-accent), #d4a359);
      color: #111;
    }

      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      width: auto;
      margin: 0.8rem auto 0;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
