<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alesia Experience - Puglia Nel Cuore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-white: #fdfbf7;
      --gold-accent: #e0a96d;
      --terracotta: #c85a32;
      --olive-green: #2d5a27;
      --sea-blue: #0077b6;
      --glass-bg: rgba(15, 15, 15, 0.65);
      --glass-border: rgba(255, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Sfondo Immagine della Tavola Pugliese */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, rgba(17, 13, 10, 0.45), rgba(17, 13, 10, 0.78)),
        url('178180.webp') no-repeat center center / cover;
      z-index: -2;
    }

    /* Overlay per rendere scuro il giusto e far risaltare il contenuto */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.72) 100%);
      z-index: -1;
    }

    /* Layout Principale */
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .location-tag {
      position: fixed;
      top: 1.1rem;
      left: 1.2rem;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(12, 12, 12, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f7f1e6;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .location-tag i {
      color: var(--gold-accent);
      font-size: 0.8rem;
    }

    .language-switcher {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 5;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.75);
      color: #fff;
      font: 500 0.8rem 'Montserrat', sans-serif;
      cursor: pointer;
      outline: none;
    }

    .language-switcher select {
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .language-switcher option {
      color: #222;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Card Glassmorphism */
    .card {
      position: relative;
      background: rgba(19, 19, 19, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 2rem 1.6rem 1.8rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.42);
      animation: fadeIn 1s ease-in-out;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0.7rem;
      transform: translateX(-50%);
      width: 140px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(224,169,109,0.9), transparent);
    }

    /* Logo Alesia in alto ben visibile */
    .brand-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin: 0 auto 1rem;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.7)) saturate(1.2) brightness(1.08);
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      padding: 0.5rem;
    }

    .brand-fallback {
      display: none;
      width: 108px;
      height: 108px;
      margin: 0 auto 1rem;
      border-radius: 22px;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(224,169,109,0.22), rgba(255,255,255,0.08));
      border: 1px solid rgba(224,169,109,0.6);
      color: #f7e8d3;
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      box-shadow: inset 0 0 18px rgba(255,255,255,0.05);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 4.2vw, 4.2rem);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #f9f3eb;
      text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    }

    .subtitle {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.32em;
      margin-bottom: 1.5rem;
    }

    /* Pulsanti */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 1rem 1.5rem;
      border-radius: 50px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    .btn i {
      font-size: 1.3rem;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
    }

    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .btn-web {
      background: linear-gradient(135deg, var(--sea-blue), #00b4d8);
    }

    .btn-review {
      background: linear-gradient(135deg, var(--gold-accent), #d4a359);
      color: #111;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      width: auto;
      margin: 0.8rem auto 0;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.7rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      box-shadow: none;
    }

    .btn-share i {
      font-size: 0.8rem;
    }

    /* Box Wi-Fi */
    .wifi-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed var(--gold-accent);
      border-radius: 16px;
      padding: 1.2rem;
      margin-top: 0.5rem;
      text-align: left;
    }

    .wifi-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--gold-accent);
      font-weight: 600;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .wifi-details {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.88rem;
      margin-bottom: 0.8rem;
    }

    .wifi-details span {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }

    .btn-wifi {
      width: 100%;
      background: linear-gradient(135deg, var(--olive-green), #52b788);
      padding: 0.75rem;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--gold-accent);
      color: #111;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 10;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <label class="language-switcher">

      <option value="en">English</option>
      <option value="pt">Portugues</option>
      <option value="es">Espanol</option>

  <div class="bg-image"></div>

          <i class="fa-solid fa-globe"></i>

        <a href="https://search.google.com/local/writereview?placeid=ChIJq3Wf5oxDRhMR6qHybjy7Bfo" target="_blank" class="btn btn-review">

            <div><strong data-i18n="network">Rete:</strong> <span>Wind3 HUB-5C5A71_EXT</span></div>
            <div><strong data-i18n="password">Password:</strong> <span>4vqlo65bjs4hzz9f</span></div>
          </div>
          <button onclick="copyPassword()" class="btn btn-wifi">
            <i class="fa-regular fa-copy"></i> <span data-i18n="copyPassword">Copia Password Wi-Fi</span>

        <button onclick="shareLink()" class="btn btn-share">

      </div>

  </div>

  <div id="toast" class="toast" data-i18n="passwordCopied">Password copiata negli appunti!</div>

  <script>
    const translations = {
      it: {
        subtitle: "Puglia Nel Cuore",
        instagram: "Profilo Instagram",
        website: "Sito Web Ufficiale",
        review: "Lascia una Recensione",
        share: "Condividici con chi vuoi tu",
        wifi: "Connessione Wi-Fi",
        network: "Rete:",
        password: "Password:",
        copyPassword: "Copia Password Wi-Fi",
        passwordCopied: "Password copiata negli appunti!",
        linkCopied: "Link esperienza copiato negli appunti!"
      },
      en: {
        subtitle: "Puglia in Your Heart",
        instagram: "Instagram Profile",
        website: "Official Website",
        review: "Leave a Review",
        share: "Share it with anyone you like",
        wifi: "Wi-Fi Connection",
        network: "Network:",
        password: "Password:",
        copyPassword: "Copy Wi-Fi Password",
        passwordCopied: "Wi-Fi password copied!",
        linkCopied: "Experience link copied!"
      },
      pt: {
        subtitle: "Puglia no Coracao",
        instagram: "Perfil do Instagram",
        website: "Site Oficial",
        review: "Deixe uma Avaliacao",
        share: "Partilhe com quem quiser",
        wifi: "Ligacao Wi-Fi",
        network: "Rede:",
        password: "Palavra-passe:",
        copyPassword: "Copiar Palavra-passe Wi-Fi",
        passwordCopied: "Palavra-passe Wi-Fi copiada!",
        linkCopied: "Link da experiencia copiado!"
      },
      es: {
        subtitle: "Puglia en el Corazon",
        instagram: "Perfil de Instagram",
        website: "Sitio Web Oficial",
        review: "Deja una Resena",
        share: "Compartelo con quien quieras",
        wifi: "Conexion Wi-Fi",
        network: "Red:",
        password: "Contrasena:",
        copyPassword: "Copiar contrasena Wi-Fi",
        passwordCopied: "Contrasena Wi-Fi copiada!",
        linkCopied: "Enlace de la experiencia copiado!"
      },
      fr: {
        subtitle: "Les Pouilles dans le Coeur",
        instagram: "Profil Instagram",
        website: "Site Officiel",
        review: "Laisser un Avis",
        share: "Partagez avec qui vous voulez",
        wifi: "Connexion Wi-Fi",
        network: "Reseau :",
        password: "Mot de passe :",
        copyPassword: "Copier le mot de passe Wi-Fi",
        passwordCopied: "Mot de passe Wi-Fi copie !",
        linkCopied: "Lien de l'experience copie !"
      }
    };

    let currentLanguage = localStorage.getItem("site-language") || "it";

    function changeLanguage(language) {
      currentLanguage = translations[language] ? language : "it";
      document.documentElement.lang = currentLanguage;
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = translations[currentLanguage][element.dataset.i18n];
      });
      document.getElementById("language-select").value = currentLanguage;
      localStorage.setItem("site-language", currentLanguage);
    }

    document.getElementById("language-select").addEventListener("change", (event) => {
      changeLanguage(event.target.value);
    });
    changeLanguage(currentLanguage);

    function copyPassword() {
      const password = "4vqlo65bjs4hzz9f";
      navigator.clipboard.writeText(password).then(() => {
        showToast(translations[currentLanguage].passwordCopied);
      });
    }

    function shareLink() {
      const shareData = {
        title: 'Alesia Experience - Puglia Nel Cuore',
        text: 'Scopri questa fantastica esperienza in Puglia!',
        url: 'https://www.airbnb.it/experiences/837734?s=67&unique_share_id=5f503b09-fc13-4553-8432-526fcc8e34c0'
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareData.url).then(() => {
          showToast(translations[currentLanguage].linkCopied);
        });
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }
  </script>
</body>
</html>
